# CIOSP Bagé — bloco de servidor Nginx.
# Na hospedagem própria: ajuste server_name, os caminhos dos certificados e "root".
# O certificado HTTPS pode ser emitido de graça com Let's Encrypt (certbot).

server {
    listen 80;
    listen [::]:80;
    server_name ciosp.bage.rs.gov.br;          # [ajustar]
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ciosp.bage.rs.gov.br;          # [ajustar]

    ssl_certificate     /etc/letsencrypt/live/ciosp.bage.rs.gov.br/fullchain.pem;   # [ajustar]
    ssl_certificate_key /etc/letsencrypt/live/ciosp.bage.rs.gov.br/privkey.pem;     # [ajustar]
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    root /var/www/ciosp;                       # [ajustar] pasta com os arquivos do site
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/ciosp-seguranca.conf;   # copiar servidor/seguranca.conf para esse caminho
    include /etc/nginx/snippets/ciosp-comum.conf;       # copiar servidor/comum.conf para esse caminho
}
