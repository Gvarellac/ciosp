# Regras comuns (hospedagem própria e Docker)
server_tokens off;
autoindex off;
error_page 404 /404.html;

# Só leitura: o site não aceita envio de dados
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Bloqueia arquivos ocultos e de configuração (exceto /.well-known)
location ~ /\.(?!well-known) { deny all; }
location ~* \.(md|py|sh|conf|bak|zip|log|docker|htaccess)$ { deny all; }
location = /_headers { deny all; }
location ^~ /servidor/ { deny all; }

location / {
    try_files $uri $uri/ =404;
}
location ~* \.(css|woff|webp|png|ico)$ {
    include /etc/nginx/snippets/ciosp-seguranca.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
location ~* \.html$ {
    include /etc/nginx/snippets/ciosp-seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
