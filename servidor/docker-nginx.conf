# Usado só pelo Dockerfile (hospedagens com container, como Railway).
# O HTTPS fica a cargo da plataforma, que entrega o tráfego já descriptografado na porta 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    include /etc/nginx/snippets/ciosp-seguranca.conf;
    include /etc/nginx/snippets/ciosp-comum.conf;
}
